name: validate

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ============================================================
  # LINUX
  # ============================================================

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-release

    env:
      LLVM_VERSION: 18
      CMAKE_PRESET: ${{ matrix.preset }}
      CCACHE_DIR: /tmp/ccache

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify Game Files
        shell: bash
        run: |
          set -e

          if [ ! -d "./MarathonRecompLib/private" ]; then
            echo "::error::MarathonRecompLib/private was not found."
            exit 1
          fi

          echo "Game files:"
          find ./MarathonRecompLib/private -maxdepth 2 -type f -print

      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ninja-build \
            llvm-${{ env.LLVM_VERSION }}-dev \
            libgtk-3-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-linux-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ matrix.preset }}-

      - name: Restore vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ./thirdparty/vcpkg/downloads
            ./thirdparty/vcpkg/packages
          key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-linux-

      - name: Show Tool Versions
        shell: bash
        run: |
          cmake --version
          ninja --version
          ccache --version
          clang --version || true

      - name: Configure Project
        shell: bash
        run: |
          set -e

          cmake . \
            --preset "${{ env.CMAKE_PRESET }}" \
            -DSDL2MIXER_VORBIS=VORBISFILE \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build Project
        shell: bash
        run: |
          set -e

          cmake \
            --build "./out/build/${{ env.CMAKE_PRESET }}" \
            --target MarathonRecomp \
            --parallel 2

      - name: Verify Linux Build
        shell: bash
        run: |
          set -e

          FILE="./out/build/${{ env.CMAKE_PRESET }}/MarathonRecomp/MarathonRecomp"

          if [ ! -f "$FILE" ]; then
            echo "::error::MarathonRecomp binary was not produced."
            exit 1
          fi

          echo "Linux build successful:"
          ls -lh "$FILE"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Linux-${{ env.CMAKE_PRESET }}
          path: ./out/build/${{ env.CMAKE_PRESET }}/MarathonRecomp/MarathonRecomp


  # ============================================================
  # WINDOWS
  # ============================================================

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        preset:
          - x64-Clang-Release

    env:
      CMAKE_PRESET: ${{ matrix.preset }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify Game Files
        shell: pwsh
        run: |
          $private = ".\MarathonRecompLib\private"

          if (-not (Test-Path $private)) {
            Write-Error "MarathonRecompLib\private was not found."
            exit 1
          }

          Write-Host "Game files:"
          Get-ChildItem $private -Recurse -File |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y --no-progress

      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-${{ matrix.preset }}

      - name: Restore vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ./thirdparty/vcpkg/downloads
            ./thirdparty/vcpkg/packages
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-

      - name: Show Tool Versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          clang-cl --version
          ccache --version

      - name: Clean Build Directory
        shell: pwsh
        run: |
          $build = ".\out\build\${{ env.CMAKE_PRESET }}"

          if (Test-Path $build) {
            Remove-Item `
              -Path $build `
              -Recurse `
              -Force
          }

      - name: Configure Project
        shell: pwsh
        run: |
          cmake . `
            --preset "${{ env.CMAKE_PRESET }}" `
            -DSDL2MIXER_VORBIS=VORBISFILE `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Verify Renderer Configuration
        shell: pwsh
        run: |
          $cache = ".\out\build\${{ env.CMAKE_PRESET }}\CMakeCache.txt"

          if (-not (Test-Path $cache)) {
            Write-Error "CMakeCache.txt was not generated."
            exit 1
          }

          Write-Host "Renderer-related CMake options:"
          Get-Content $cache |
            Select-String "D3D12|VULKAN|METAL"

      - name: Build Project
        shell: pwsh
        run: |
          $build = ".\out\build\${{ env.CMAKE_PRESET }}"

          cmake `
            --build $build `
            --target MarathonRecomp `
            --parallel 2 `
            --verbose

      - name: Verify Windows Build
        shell: pwsh
        run: |
          $build = ".\out\build\${{ env.CMAKE_PRESET }}\MarathonRecomp"

          $required = @(
            "$build\MarathonRecomp.exe"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Error "Required file missing: $file"
              exit 1
            }

            Write-Host "Found: $file"
          }

          Write-Host "Windows build successful."

      - name: Pack Windows Release
        shell: pwsh
        run: |
          $build = ".\out\build\${{ env.CMAKE_PRESET }}\MarathonRecomp"
          $release = ".\release"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $release |
            Out-Null

          Copy-Item `
            "$build\MarathonRecomp.exe" `
            "$release\MarathonRecomp.exe" `
            -Force

          if (Test-Path "$build\D3D12\D3D12Core.dll") {
            New-Item `
              -ItemType Directory `
              -Force `
              -Path "$release\D3D12" |
              Out-Null

            Copy-Item `
              "$build\D3D12\D3D12Core.dll" `
              "$release\D3D12\D3D12Core.dll" `
              -Force
          }

          if (Test-Path "$build\dxcompiler.dll") {
            Copy-Item `
              "$build\dxcompiler.dll" `
              "$release\dxcompiler.dll" `
              -Force
          }

          if (Test-Path "$build\dxil.dll") {
            Copy-Item `
              "$build\dxil.dll" `
              "$release\dxil.dll" `
              -Force
          }

          Write-Host "Release contents:"
          Get-ChildItem $release -Recurse

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Windows-x64-Release
          path: .\release


  # ============================================================
  # FLATPAK
  # ============================================================

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-24.04

    env:
      FLATPAK_ID: io.github.sonicnext_dev.marathonrecomp
      FREEDESKTOP_VERSION: "23.08"
      LLVM_VERSION: 18
      CCACHE_DIR: /tmp/ccache

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify Game Files
        shell: bash
        run: |
          set -e

          if [ ! -d "./MarathonRecompLib/private" ]; then
            echo "::error::MarathonRecompLib/private was not found."
            exit 1
          fi

          find ./MarathonRecompLib/private -maxdepth 2 -type f -print

      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-flatpak-${{ github.sha }}
          restore-keys: |
            ccache-flatpak-

      - name: Setup Flathub
        shell: bash
        run: |
          set -e

          flatpak \
            --user \
            remote-add \
            --if-not-exists \
            flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak SDK
        shell: bash
        run: |
          set -e

          flatpak \
            --user \
            install \
            -y \
            flathub \
            org.freedesktop.Sdk//${{ env.FREEDESKTOP_VERSION }}

          flatpak \
            --user \
            install \
            -y \
            flathub \
            org.freedesktop.Sdk.Extension.llvm${{ env.LLVM_VERSION }}//${{ env.FREEDESKTOP_VERSION }}

      - name: Build Flatpak
        shell: bash
        run: |
          set -e

          echo "commit_message=$(git log -1 --pretty=%s)" >> "$GITHUB_ENV"

          flatpak-builder \
            --user \
            --force-clean \
            --install-deps-from=flathub \
            --repo=repo \
            --ccache \
            builddir \
            "./flatpak/${FLATPAK_ID}.json"

      - name: Create Flatpak Bundle
        shell: bash
        run: |
          set -e

          flatpak build-bundle \
            repo \
            "./${FLATPAK_ID}.flatpak" \
            "${FLATPAK_ID}" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Flatpak
          path: ./${{ env.FLATPAK_ID }}.flatpak


  # ============================================================
  # MACOS
  # ============================================================

  build-macos:
    name: Build macOS
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64

        preset:
          - macos-release

    env:
      CMAKE_PRESET: ${{ matrix.preset }}
      CCACHE_DIR: /tmp/ccache

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify Game Files
        shell: bash
        run: |
          set -e

          if [ ! -d "./MarathonRecompLib/private" ]; then
            echo "::error::MarathonRecompLib/private was not found."
            exit 1
          fi

          find ./MarathonRecompLib/private -maxdepth 2 -type f -print

      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          brew install ninja ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-macos-${{ matrix.arch }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ matrix.arch }}-${{ matrix.preset }}-

      - name: Restore vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ./thirdparty/vcpkg/downloads
            ./thirdparty/vcpkg/packages
          key: vcpkg-macos-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-macos-${{ matrix.arch }}-

      - name: Show Tool Versions
        shell: bash
        run: |
          cmake --version
          ninja --version
          ccache --version

      - name: Configure Project
        shell: bash
        run: |
          set -e

          cmake . \
            --preset "${{ env.CMAKE_PRESET }}" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DSDL2MIXER_VORBIS=VORBISFILE \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build Project
        shell: bash
        run: |
          set -e

          cmake \
            --build "./out/build/${{ env.CMAKE_PRESET }}" \
            --target MarathonRecomp \
            --parallel 2

      - name: Verify macOS Build
        shell: bash
        run: |
          set -e

          APP="./out/build/${{ env.CMAKE_PRESET }}/MarathonRecomp/Marathon Recompiled.app"

          if [ ! -d "$APP" ]; then
            echo "::error::macOS application was not produced."
            exit 1
          fi

          echo "macOS build successful."

      - name: Package macOS
        shell: bash
        run: |
          set -e

          APP="./out/build/${{ env.CMAKE_PRESET }}/MarathonRecomp/Marathon Recompiled.app"

          codesign \
            --deep \
            -fs - \
            "$APP"

          tar \
            -czf \
            "MarathonRecomp-macOS-${{ matrix.arch }}-${{ env.CMAKE_PRESET }}.tar.gz" \
            -C "./out/build/${{ env.CMAKE_PRESET }}/MarathonRecomp" \
            "Marathon Recompiled.app"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-macOS-${{ matrix.arch }}-${{ env.CMAKE_PRESET }}
          path: "MarathonRecomp-macOS-${{ matrix.arch }}-${{ env.CMAKE_PRESET }}.tar.gz"
