name: validateorbuild

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-debug
          - linux-release
          - linux-relwithdebinfo

    env:
      LLVM_VERSION: 18
      CMAKE_PRESET: ${{ matrix.preset }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize and verify submodules
        shell: bash
        run: |
          set -euxo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive --force

          echo "=== Submodules ==="
          git submodule status --recursive

          echo "=== Checking vcpkg ==="
          test -f "./thirdparty/vcpkg/scripts/buildsystems/vcpkg.cmake"

          echo "vcpkg toolchain found:"
          realpath "./thirdparty/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Verify game files
        shell: bash
        run: |
          set -e

          if [ ! -d "./MarathonRecompLib/private" ]; then
            echo "::error::MarathonRecompLib/private was not found."
            exit 1
          fi

          echo "Game files found:"
          find ./MarathonRecompLib/private -maxdepth 2 -type f -print

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ matrix.preset }}

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ./thirdparty/vcpkg/downloads
            ./thirdparty/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install Dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt update

          sudo apt install -y \
            ninja-build \
            llvm-${{ env.LLVM_VERSION }}-dev \
            libgtk-3-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev

          echo "=== Ninja ==="
          ninja --version

          echo "=== CMake ==="
          cmake --version

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          set -euxo pipefail

          ./thirdparty/vcpkg/bootstrap-vcpkg.sh -disableMetrics

          ./thirdparty/vcpkg/vcpkg version

      - name: Configure Project
        env:
          CCACHE_DIR: /tmp/ccache
        shell: bash
        run: |
          set -euxo pipefail

          cmake . \
            --preset "${{ env.CMAKE_PRESET }}" \
            -DSDL2MIXER_VORBIS=VORBISFILE \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build Project
        env:
          CCACHE_DIR: /tmp/ccache
        shell: bash
        run: |
          set -euxo pipefail

          cmake --build "./out/build/${{ env.CMAKE_PRESET }}" \
            --target MarathonRecomp \
            --parallel 2

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Linux-${{ env.CMAKE_PRESET }}
          path: ./out/build/${{ env.CMAKE_PRESET }}/MarathonRecomp/MarathonRecomp


  build-windows:
    name: Build Windows
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        preset:
          - x64-Clang-Debug
          - x64-Clang-Release
          - x64-Clang-RelWithDebInfo

    env:
      CMAKE_PRESET: ${{ matrix.preset }}
      MARATHON_RECOMP_D3D12: "ON"
      MARATHON_RECOMP_METAL: "OFF"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize Git submodules
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git submodule sync --recursive
          git submodule update --init --recursive --force

          Write-Host "=== Submodule status ==="
          git submodule status --recursive

      - name: Verify vcpkg toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgToolchain = Join-Path $PWD "thirdparty\vcpkg\scripts\buildsystems\vcpkg.cmake"

          Write-Host "Checking:"
          Write-Host $vcpkgToolchain

          if (-not (Test-Path -LiteralPath $vcpkgToolchain -PathType Leaf)) {
            Write-Error "vcpkg toolchain was not found: $vcpkgToolchain"

            Write-Host ""
            Write-Host "=== thirdparty directory ==="

            if (Test-Path ".\thirdparty") {
              Get-ChildItem ".\thirdparty" -Force
            }

            Write-Host ""
            Write-Host "=== vcpkg directory ==="

            if (Test-Path ".\thirdparty\vcpkg") {
              Get-ChildItem ".\thirdparty\vcpkg" -Force
            }

            exit 1
          }

          Write-Host "vcpkg toolchain found:"
          Write-Host (Resolve-Path $vcpkgToolchain)

      - name: Verify game files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path ".\MarathonRecompLib\private")) {
            Write-Error "MarathonRecompLib\private was not found."
            exit 1
          }

          Write-Host "Game files found:"
          Get-ChildItem ".\MarathonRecompLib\private" -Recurse -File |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ matrix.preset }}

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ./thirdparty/vcpkg/downloads
            ./thirdparty/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install ninja -y --no-progress

          $chocoBin = "C:\ProgramData\chocolatey\bin"

          if (Test-Path $chocoBin) {
            Add-Content `
              -Path $env:GITHUB_PATH `
              -Value $chocoBin

            $env:Path = "$chocoBin;$env:Path"
          }

          Write-Host "=== Ninja location ==="
          where.exe ninja

          Write-Host "=== Ninja version ==="
          ninja --version

      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkg = Join-Path $PWD "thirdparty\vcpkg"

          $bootstrap = Join-Path $vcpkg "bootstrap-vcpkg.bat"

          if (-not (Test-Path $bootstrap)) {
            Write-Error "vcpkg bootstrap script was not found: $bootstrap"
            exit 1
          }

          & $bootstrap -disableMetrics

          if ($LASTEXITCODE -ne 0) {
            Write-Error "vcpkg bootstrap failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          & (Join-Path $vcpkg "vcpkg.exe") version

      - name: Configure Project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $preset = "${{ env.CMAKE_PRESET }}"
          $buildDir = Join-Path $PWD "out\build\$preset"

          Write-Host "=== Working directory ==="
          Write-Host $PWD

          Write-Host "=== Preset ==="
          Write-Host $preset

          Write-Host "=== Ninja ==="
          where.exe ninja
          ninja --version

          Write-Host "=== vcpkg toolchain ==="
          $vcpkgToolchain = Join-Path $PWD "thirdparty\vcpkg\scripts\buildsystems\vcpkg.cmake"
          Write-Host (Resolve-Path $vcpkgToolchain)

          # Completely remove this preset's previous CMake state.
          if (Test-Path $buildDir) {
            Write-Host "Removing old build directory:"
            Write-Host $buildDir

            Remove-Item `
              -Path $buildDir `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $buildDir `
            -Force |
            Out-Null

          cmake . `
            --preset "$preset" `
            -DMARATHON_RECOMP_D3D12=ON `
            -DMARATHON_RECOMP_METAL=OFF `
            -DSDL2MIXER_VORBIS=VORBISFILE `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "=== Renderer configuration ==="

          $cacheFile = Join-Path $buildDir "CMakeCache.txt"

          if (-not (Test-Path $cacheFile)) {
            Write-Error "CMakeCache.txt was not generated."
            exit 1
          }

          Get-Content $cacheFile |
            Select-String "MARATHON_RECOMP_D3D12|MARATHON_RECOMP_METAL|CMAKE_TOOLCHAIN_FILE"

      - name: Build Project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $buildDir = ".\out\build\${{ env.CMAKE_PRESET }}"

          cmake --build $buildDir `
            --target MarathonRecomp `
            --parallel 2

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify D3D12 Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $build = ".\out\build\${{ env.CMAKE_PRESET }}\MarathonRecomp"

          $required = @(
            "$build\MarathonRecomp.exe",
            "$build\D3D12\D3D12Core.dll",
            "$build\dxcompiler.dll",
            "$build\dxil.dll"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Error "Required D3D12 build file is missing: $file"
              exit 1
            }

            Write-Host "Found: $file"
          }

      - name: Pack Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $release = ".\release"
          $d3d12Release = ".\release\D3D12"
          $build = ".\out\build\${{ env.CMAKE_PRESET }}\MarathonRecomp"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $release |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $d3d12Release |
            Out-Null

          Copy-Item `
            "$build\D3D12\D3D12Core.dll" `
            "$d3d12Release\D3D12Core.dll" `
            -Force

          Copy-Item `
            "$build\dxcompiler.dll" `
            "$release\dxcompiler.dll" `
            -Force

          Copy-Item `
            "$build\dxil.dll" `
            "$release\dxil.dll" `
            -Force

          Copy-Item `
            "$build\MarathonRecomp.exe" `
            "$release\MarathonRecomp.exe" `
            -Force

          Write-Host "=== Windows package ==="
          Get-ChildItem $release -Recurse

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Windows-${{ env.CMAKE_PRESET }}
          path: .\release

      - name: Upload PDB
        if: matrix.preset != 'x64-Clang-Release'
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Windows-${{ env.CMAKE_PRESET }}-PDB
          path: .\out\build\${{ env.CMAKE_PRESET }}\MarathonRecomp\MarathonRecomp.pdb


  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-24.04

    env:
      FLATPAK_ID: io.github.sonicnext_dev.marathonrecomp
      FREEDESKTOP_VERSION: "23.08"
      LLVM_VERSION: 18

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          set -euxo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Verify game files
        shell: bash
        run: |
          set -e

          if [ ! -d "./MarathonRecompLib/private" ]; then
            echo "::error::MarathonRecompLib/private was not found."
            exit 1
          fi

          find ./MarathonRecompLib/private -maxdepth 2 -type f -print

      - name: Install Dependencies
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y flatpak-builder ccache

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ runner.os }}

      - name: Prepare Flatpak
        shell: bash
        run: |
          set -euxo pipefail

          flatpak --user remote-add \
            --if-not-exists \
            flathub \
            https://flathub.org/repo/flathub.flatpakrepo

          flatpak --user install -y \
            flathub \
            org.freedesktop.Sdk//${{ env.FREEDESKTOP_VERSION }}

          flatpak --user install -y \
            flathub \
            org.freedesktop.Sdk.Extension.llvm${{ env.LLVM_VERSION }}//${{ env.FREEDESKTOP_VERSION }}

      - name: Build Flatpak
        shell: bash
        run: |
          set -euxo pipefail

          echo "commit_message=$(git log -1 --pretty=%s)" >> "$GITHUB_ENV"

          export CCACHE_DIR=/tmp/ccache

          flatpak-builder \
            --user \
            --force-clean \
            --install-deps-from=flathub \
            --repo=repo \
            --ccache \
            builddir \
            "./flatpak/${{ env.FLATPAK_ID }}.json"

          flatpak build-bundle \
            repo \
            "./${{ env.FLATPAK_ID }}.flatpak" \
            "${{ env.FLATPAK_ID }}" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Flatpak
          path: ./${{ env.FLATPAK_ID }}.flatpak


  build-macos:
    name: Build macOS
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
        preset:
          - macos-debug
          - macos-release
          - macos-relwithdebinfo

    env:
      CMAKE_PRESET: ${{ matrix.preset }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          set -euxo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Verify game files
        shell: bash
        run: |
          set -e

          if [ ! -d "./MarathonRecompLib/private" ]; then
            echo "::error::MarathonRecompLib/private was not found."
            exit 1
          fi

          find ./MarathonRecompLib/private -maxdepth 2 -type f -print

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.preset }}

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ./thirdparty/vcpkg/downloads
            ./thirdparty/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install Dependencies
        shell: bash
        run: |
          brew install ninja

      - name: Cache ccache Directory
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.preset }}

      - name: Configure Project
        env:
          CCACHE_DIR: /tmp/ccache
        shell: bash
        run: |
          set -euxo pipefail

          cmake . \
            --preset "${{ env.CMAKE_PRESET }}" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DSDL2MIXER_VORBIS=VORBISFILE \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build Project
        env:
          CCACHE_DIR: /tmp/ccache
        shell: bash
        run: |
          set -euxo pipefail

          cmake --build "./out/build/${{ env.CMAKE_PRESET }}" \
            --target MarathonRecomp \
            --parallel 2

      - name: Pack Release
        shell: bash
        run: |
          set -euxo pipefail

          codesign --deep -fs - \
            "./out/build/${{ env.CMAKE_PRESET }}/Marathon Recompiled.app"

          tar -czf \
            "MarathonRecomp-macOS-${{ matrix.arch }}-${{ env.CMAKE_PRESET }}.tar.gz" \
            -C "./out/build/${{ env.CMAKE_PRESET }}/MarathonRecomp" \
            "Marathon Recompiled.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-macOS-${{ matrix.arch }}-${{ env.CMAKE_PRESET }}
          path: "MarathonRecomp-macOS-${{ matrix.arch }}-${{ env.CMAKE_PRESET }}.tar.gz"
