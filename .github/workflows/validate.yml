name: validateorbuild

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        preset:
          - linux-debug
          - linux-release
          - linux-relwithdebinfo

    env:
      LLVM_VERSION: 18
      CMAKE_PRESET: ${{ matrix.preset }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify game files
        shell: bash
        run: |
          set -e

          if [ ! -d "./MarathonRecompLib/private" ]; then
            echo "::error::MarathonRecompLib/private was not found."
            exit 1
          fi

          echo "Game files found in MarathonRecompLib/private:"
          find ./MarathonRecompLib/private -maxdepth 2 -type f -print

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ matrix.preset }}

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ./thirdparty/vcpkg/downloads
            ./thirdparty/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            ninja-build \
            llvm-${{ env.LLVM_VERSION }}-dev \
            libgtk-3-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev

      - name: Cache ccache Directory
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ runner.os }}-${{ matrix.preset }}

      - name: Configure Project
        env:
          CCACHE_DIR: /tmp/ccache
        run: |
          cmake . \
            --preset "${{ env.CMAKE_PRESET }}" \
            -DSDL2MIXER_VORBIS=VORBISFILE \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build Project
        env:
          CCACHE_DIR: /tmp/ccache
        run: |
          cmake --build "./out/build/${{ env.CMAKE_PRESET }}" \
            --target MarathonRecomp \
            --parallel 2

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Linux-${{ env.CMAKE_PRESET }}
          path: ./out/build/${{ env.CMAKE_PRESET }}/MarathonRecomp/MarathonRecomp


  build-windows:
    name: Build Windows
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        preset:
          - x64-Clang-Debug
          - x64-Clang-Release
          - x64-Clang-RelWithDebInfo

    env:
      CMAKE_PRESET: ${{ matrix.preset }}
      MARATHON_RECOMP_D3D12: "ON"
      MARATHON_RECOMP_METAL: "OFF"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify game files
        shell: pwsh
        run: |
          if (-not (Test-Path ".\MarathonRecompLib\private")) {
            Write-Error "MarathonRecompLib\private was not found."
            exit 1
          }

          Write-Host "Game files found in MarathonRecompLib\private:"
          Get-ChildItem ".\MarathonRecompLib\private" -Recurse -File |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ matrix.preset }}

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ./thirdparty/vcpkg/downloads
            ./thirdparty/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install Dependencies
        shell: pwsh
        run: |
          choco install ninja -y

          Remove-Item `
            -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" `
            -Force `
            -ErrorAction SilentlyContinue

      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Project
        shell: pwsh
        run: |
          $buildDir = ".\out\build\${{ env.CMAKE_PRESET }}"

          # Remove this preset's generated build directory.
          # This prevents an old CMake cache from selecting another renderer.
          if (Test-Path $buildDir) {
            Remove-Item -Recurse -Force $buildDir
          }

          cmake . `
            --preset "${{ env.CMAKE_PRESET }}" `
            -DMARATHON_RECOMP_D3D12=ON `
            -DMARATHON_RECOMP_METAL=OFF `
            -DSDL2MIXER_VORBIS=VORBISFILE `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

          Write-Host "=== Renderer configuration ==="

          Get-Content "$buildDir\CMakeCache.txt" |
            Select-String "MARATHON_RECOMP_D3D12|MARATHON_RECOMP_METAL"

      - name: Build Project
        shell: pwsh
        run: |
          cmake --build ".\out\build\${{ env.CMAKE_PRESET }}" `
            --target MarathonRecomp `
            --parallel 2

      - name: Verify D3D12 Build
        shell: pwsh
        run: |
          $build = ".\out\build\${{ env.CMAKE_PRESET }}\MarathonRecomp"

          $required = @(
            "$build\MarathonRecomp.exe",
            "$build\D3D12\D3D12Core.dll",
            "$build\dxcompiler.dll",
            "$build\dxil.dll"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Error "Required D3D12 build file is missing: $file"
              exit 1
            }

            Write-Host "Found: $file"
          }

      - name: Pack Release
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\release" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path ".\release\D3D12" |
            Out-Null

          $build = ".\out\build\${{ env.CMAKE_PRESET }}\MarathonRecomp"

          Copy-Item `
            "$build\D3D12\D3D12Core.dll" `
            ".\release\D3D12\D3D12Core.dll" `
            -Force

          Copy-Item `
            "$build\dxcompiler.dll" `
            ".\release\dxcompiler.dll" `
            -Force

          Copy-Item `
            "$build\dxil.dll" `
            ".\release\dxil.dll" `
            -Force

          Copy-Item `
            "$build\MarathonRecomp.exe" `
            ".\release\MarathonRecomp.exe" `
            -Force

          Write-Host "=== Windows package ==="
          Get-ChildItem ".\release" -Recurse

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Windows-${{ env.CMAKE_PRESET }}
          path: .\release

      - name: Upload PDB
        if: matrix.preset != 'x64-Clang-Release'
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Windows-${{ env.CMAKE_PRESET }}-PDB
          path: .\out\build\${{ env.CMAKE_PRESET }}\MarathonRecomp\MarathonRecomp.pdb


  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-24.04

    env:
      FLATPAK_ID: io.github.sonicnext_dev.marathonrecomp
      FREEDESKTOP_VERSION: "23.08"
      LLVM_VERSION: 18

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify game files
        shell: bash
        run: |
          set -e

          if [ ! -d "./MarathonRecompLib/private" ]; then
            echo "::error::MarathonRecompLib/private was not found."
            exit 1
          fi

          find ./MarathonRecompLib/private -maxdepth 2 -type f -print

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y flatpak-builder ccache

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ runner.os }}

      - name: Prepare Flatpak
        run: |
          flatpak --user remote-add \
            --if-not-exists \
            flathub \
            https://flathub.org/repo/flathub.flatpakrepo

          flatpak --user install -y \
            flathub \
            org.freedesktop.Sdk//${{ env.FREEDESKTOP_VERSION }}

          flatpak --user install -y \
            flathub \
            org.freedesktop.Sdk.Extension.llvm${{ env.LLVM_VERSION }}//${{ env.FREEDESKTOP_VERSION }}

      - name: Build Flatpak
        run: |
          echo "commit_message=$(git log -1 --pretty=%s)" >> "$GITHUB_ENV"

          export CCACHE_DIR=/tmp/ccache

          flatpak-builder \
            --user \
            --force-clean \
            --install-deps-from=flathub \
            --repo=repo \
            --ccache \
            builddir \
            "./flatpak/${{ env.FLATPAK_ID }}.json"

          flatpak build-bundle \
            repo \
            "./${{ env.FLATPAK_ID }}.flatpak" \
            "${{ env.FLATPAK_ID }}" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Flatpak
          path: ./${{ env.FLATPAK_ID }}.flatpak


  build-macos:
    name: Build macOS
    runs-on: macos-15

    strategy:
      matrix:
        arch:
          - arm64
        preset:
          - macos-debug
          - macos-release
          - macos-relwithdebinfo

    env:
      CMAKE_PRESET: ${{ matrix.preset }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify game files
        shell: bash
        run: |
          set -e

          if [ ! -d "./MarathonRecompLib/private" ]; then
            echo "::error::MarathonRecompLib/private was not found."
            exit 1
          fi

          find ./MarathonRecompLib/private -maxdepth 2 -type f -print

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.preset }}

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ./thirdparty/vcpkg/downloads
            ./thirdparty/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install Dependencies
        run: |
          brew install ninja

      - name: Cache ccache Directory
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.preset }}

      - name: Configure Project
        env:
          CCACHE_DIR: /tmp/ccache
        run: |
          cmake . \
            --preset "${{ env.CMAKE_PRESET }}" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DSDL2MIXER_VORBIS=VORBISFILE \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build Project
        env:
          CCACHE_DIR: /tmp/ccache
        run: |
          cmake --build "./out/build/${{ env.CMAKE_PRESET }}" \
            --target MarathonRecomp \
            --parallel 2

      - name: Pack Release
        run: |
          codesign --deep -fs - \
            "./out/build/${{ env.CMAKE_PRESET }}/Marathon Recompiled.app"

          tar -czf \
            "MarathonRecomp-macOS-${{ matrix.arch }}-${{ env.CMAKE_PRESET }}.tar.gz" \
            -C "./out/build/${{ env.CMAKE_PRESET }}/MarathonRecomp" \
            "Marathon Recompiled.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-macOS-${{ matrix.arch }}-${{ env.CMAKE_PRESET }}
          path: "MarathonRecomp-macOS-${{ matrix.arch }}-${{ env.CMAKE_PRESET }}.tar.gz"
